name: Publish packages
on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Comma-separated package names, or all'
        required: true
        default: all
        type: string
concurrency:
  group: npm-publication
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-checks.yml
  publish:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # npm is only the OIDC upload client; Bun owns installs, locks and builds.
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: npm-packages-${{ github.sha }}
          path: .local/release
      - name: Publish checked tarballs
        env:
          PACKAGE_SELECTION: ${{ inputs.packages }}
        run: bun scripts/publish.ts .local/release "$PACKAGE_SELECTION"
