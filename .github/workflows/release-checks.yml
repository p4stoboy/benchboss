name: Release checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run pack:release --output .local/release
      - run: bun run test:packages --packages .local/release
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: npm-packages-${{ github.sha }}
          path: |
            .local/release/*.tgz
            .local/release/manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
